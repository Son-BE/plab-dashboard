<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Guest Demo</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #edf4ff;
      --text: #122033;
      --muted: #5e6d82;
      --success: #1e9d68;
      --warning: #d79627;
      --danger: #d95454;
      --shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      --sidebar: #0f172a;
      --sidebar-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--sidebar); color: white; padding: 22px 18px; }
    .brand { font-size: 26px; font-weight: 800; letter-spacing: 0.08em; margin: 6px 8px 26px; }
    .nav-group { margin-bottom: 22px; }
    .nav-label { font-size: 11px; color: var(--sidebar-muted); padding: 0 8px 10px; letter-spacing: 0.12em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; font-weight: 600; color: #dfeaf8; margin-bottom: 6px; }
    .nav-item.active { background: rgba(255,255,255,0.07); border: 1px solid rgba(148,163,184,0.15); }
    .nav-item .icon { width: 8px; height: 8px; border-radius: 50%; background: #7da7ff; box-shadow: 0 0 0 4px rgba(125,167,255,0.18); }

    .content { flex: 1; padding: 26px 28px 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title-wrap h1 { margin: 0; font-size: 30px; letter-spacing: -0.04em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .pill { border: 1px solid #e2e8f0; background: white; border-radius: 10px; padding: 9px 12px; color: var(--muted); font-size: 13px; font-weight: 600; }

    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .filter { padding: 8px 12px; border-radius: 999px; border: 1px solid #e2e8f0; background: white; color: var(--muted); font-size: 13px; font-weight: 600; }
    .filter.active { background: var(--primary-soft); color: var(--primary); border-color: #cfe0ff; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 18px 16px;
    }
    .metric-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .metric-head label { color: var(--muted); font-size: 13px; font-weight: 600; }
    .delta { display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 8px; border-radius: 999px; }
    .delta.good { background: #eafaf2; color: var(--success); }
    .metric-value { font-size: 30px; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 8px; }
    .micro-chart { height: 34px; margin-top: 8px; }
    .micro-chart svg { width: 100%; height: 100%; display: block; }
    .micro-line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke: var(--success); }

    .main-grid { display: grid; grid-template-columns: 1.8fr 1.1fr; gap: 18px; margin-bottom: 20px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .panel-title { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
    .link-btn { color: var(--primary); font-size: 13px; font-weight: 700; background: transparent; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 12px 10px; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; background: #f8fafc; }
    .status-badge { display: inline-flex; align-items: center; justify-content: center; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .status-badge.normal { background: #eafaf2; color: var(--success); }
    .status-badge.review { background: #fff4dc; color: var(--warning); }

    .inline-box { display: grid; gap: 12px; }
    .mini-box { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .mini-box h4 { margin: 0 0 10px; font-size: 15px; }
    .mini-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .mini-row:last-child { border-bottom: none; }
    .tag { display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 5px 8px; }

    @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .main-grid { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { display: block; } .sidebar { width: 100%; } .content { padding: 18px 16px 24px; } .stats-grid { grid-template-columns: 1fr; } .topbar { display: block; } .top-actions { margin-top: 14px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">PLAB</div>
      <div class="nav-group">
        <div class="nav-label">사용자</div>
        <div class="nav-item active"><span class="icon"></span> 대시보드</div>
        <div class="nav-item"><span class="icon"></span> 내 기업</div>
        <div class="nav-item"><span class="icon"></span> 세션 일정</div>
        <div class="nav-item"><span class="icon"></span> 자료 제출</div>
      </div>
      <div class="nav-group">
        <div class="nav-label">리포트</div>
        <div class="nav-item"><span class="icon"></span> 활동 내역</div>
        <div class="nav-item"><span class="icon"></span> 공지사항</div>
      </div>
    </aside>

    <main class="content">
      <div class="topbar">
        <div class="title-wrap">
          <h1>고객사 대시보드</h1>
          <div class="sub">에이스테크 · 1회차 프로그램 운영현황</div>
        </div>
        <div class="top-actions">
          <div class="pill">조회권한 · 기업 담당자</div>
        </div>
      </div>

      <div class="filters">
        <div class="filter active">전체</div>
        <div class="filter">수도권</div>
        <div class="filter">이번 주</div>
        <div class="filter">지연</div>
      </div>

      <section class="stats-grid">
        <div class="card">
          <div class="metric-head"><label>진행률</label><span class="delta good">+6.4%</span></div>
          <div class="metric-value">74%</div>
          <div class="micro-chart"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline class="micro-line" points="0,24 15,21 30,18 45,15 60,11 75,8 90,5 100,2"></polyline></svg></div>
        </div>
        <div class="card">
          <div class="metric-head"><label>세션 완료</label><span class="delta good">+3.2%</span></div>
          <div class="metric-value">6/8</div>
          <div class="micro-chart"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline class="micro-line" points="0,28 15,24 30,19 45,17 60,13 75,9 90,6 100,3"></polyline></svg></div>
        </div>
        <div class="card">
          <div class="metric-head"><label>자료 제출</label><span class="delta good">+2.1%</span></div>
          <div class="metric-value">12/14</div>
          <div class="micro-chart"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline class="micro-line" points="0,30 15,25 30,22 45,17 60,14 75,10 90,5 100,3"></polyline></svg></div>
        </div>
        <div class="card">
          <div class="metric-head"><label>조치 필요</label><span class="delta good">2건</span></div>
          <div class="metric-value">2</div>
          <div class="micro-chart"><svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline class="micro-line" points="0,26 15,22 30,18 45,14 60,15 75,10 90,8 100,5"></polyline></svg></div>
        </div>
      </section>

      <section class="main-grid">
        <div class="card">
          <div class="panel-header">
            <div class="panel-title">진행 현황</div>
            <button class="link-btn">상세보기</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>주차</th>
                <th>세션</th>
                <th>진행 여부</th>
                <th>자료</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>1</td><td>OT 및 목표설정</td><td><span class="status-badge normal">완료</span></td><td>완료</td><td>정상</td></tr>
              <tr><td>2</td><td>현황 점검</td><td><span class="status-badge normal">완료</span></td><td>완료</td><td>정상</td></tr>
              <tr><td>3</td><td>프로젝트 리뷰</td><td><span class="status-badge review">보통</span></td><td>대기</td><td>보완 필요</td></tr>
              <tr><td>4</td><td>실행 계획수립</td><td><span class="status-badge normal">완료</span></td><td>완료</td><td>정상</td></tr>
            </tbody>
          </table>
        </div>

        <div class="inline-box">
          <div class="mini-box">
            <h4>이번 주 일정</h4>
            <div class="mini-row"><span>세션 5차</span><span class="tag">5/20</span></div>
            <div class="mini-row"><span>결과보고서</span><span class="tag">5/23</span></div>
          </div>
          <div class="mini-box">
            <h4>알림</h4>
            <div class="mini-row"><span>자료 미제출</span><span class="tag">1건</span></div>
            <div class="mini-row"><span>일정 조정</span><span class="tag">확인</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
